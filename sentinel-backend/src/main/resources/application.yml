spring:
  application:
    name: sentinel-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel_aml}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8090}

sentinel:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  demo-users:
    # Local-dev-only seed passwords. Override via env vars for any non-local use.
    admin-password: ${SENTINEL_ADMIN_PASSWORD:Admin@12345}
    analyst-password: ${SENTINEL_ANALYST_PASSWORD:Analyst@12345}
    viewer-password: ${SENTINEL_VIEWER_PASSWORD:Viewer@12345}
  detection:
    thread-pool-size: ${DETECTION_THREAD_POOL_SIZE:8}
    rule-config-cache-ttl-seconds: ${RULE_CONFIG_CACHE_TTL_SECONDS:30}
  base-currency: INR
  anomaly:
    algorithm: ${ANOMALY_ALGORITHM:ISOLATION_FOREST} # or KMEANS_CLUSTERING
    anomaly-percentile-threshold: ${ANOMALY_PERCENTILE_THRESHOLD:95.0}
    bootstrap-demo-data: ${ANOMALY_BOOTSTRAP_DEMO_DATA:true}
    isolation-forest:
      trees: 150
      subsample-rate: 0.8
    kmeans:
      clusters: 6

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.sentinel.aml: INFO
